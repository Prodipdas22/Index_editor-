<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Code Runner & Assignment Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <header class="toolbar">
        <div class="brand">
            <i class="fa-solid fa-code"></i> Code Runner
        </div>
        <div class="actions">
            <button id="btn-run" class="btn btn-primary" title="Execute Code"><i class="fa-solid fa-play"></i> Run</button>
            <button id="btn-pdf" class="btn btn-primary" title="Generate Assignment PDF" style="background-color: #6f42c1;"><i class="fa-solid fa-file-pdf"></i> Generate PDF</button>
            <button id="btn-save" class="btn" title="Save code to browser memory"><i class="fa-solid fa-floppy-disk"></i> Save</button>
            
            <label for="file-upload" class="btn custom-file-upload" title="Open an HTML file">
                <i class="fa-solid fa-folder-open"></i> Open
            </label>
            <input id="file-upload" type="file" accept=".html"/>
            
            <button id="btn-download" class="btn" title="Download as .html file"><i class="fa-solid fa-download"></i> Download</button>
            <button id="btn-screenshot" class="btn" title="Capture a macOS-style screenshot of preview"><i class="fa-solid fa-camera"></i> Capture UI</button>
            <button id="btn-copy" class="btn" title="Copy all code to clipboard"><i class="fa-solid fa-copy"></i> Copy</button>
            <button id="btn-reset" class="btn btn-danger" title="Clear all code"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        </div>
        <div class="controls">
            <button id="btn-theme" class="btn icon-btn" title="Toggle Dark/Light Mode"><i class="fa-solid fa-sun"></i></button>
            <button id="btn-full" class="btn icon-btn" title="Fullscreen Preview"><i class="fa-solid fa-expand"></i></button>
        </div>
    </header>

    <div class="assignment-bar panel">
        <input type="text" id="exp-title" placeholder="Experiment Title (e.g., Experiment 01: Create a HTML document...)">
        <input type="text" id="exp-objective" placeholder="Objective: To create a basic HTML document...">
    </div>

    <main class="workspace">
        <div class="editor-container" id="editor-layout">
            <div class="panel html-panel" id="panel-html">
                <div class="panel-header">
                    <div><span class="lang-color html-color"></span> HTML</div>
                    <button class="btn-small btn-minimize" data-panel="html" title="Minimize/Maximize HTML"><i class="fa-solid fa-chevron-down"></i></button>
                </div>
                <textarea id="html-code" spellcheck="false" placeholder=""></textarea>
            </div>
            <div class="panel css-panel" id="panel-css">
                <div class="panel-header">
                    <div><span class="lang-color css-color"></span> CSS</div>
                    <button class="btn-small btn-minimize" data-panel="css" title="Minimize/Maximize CSS"><i class="fa-solid fa-chevron-down"></i></button>
                </div>
                <textarea id="css-code" spellcheck="false" placeholder="/* Write CSS here */"></textarea>
            </div>
            <div class="panel js-panel" id="panel-js">
                <div class="panel-header">
                    <div><span class="lang-color js-color"></span> JavaScript</div>
                    <button class="btn-small btn-minimize" data-panel="js" title="Minimize/Maximize JS"><i class="fa-solid fa-chevron-down"></i></button>
                </div>
                <textarea id="js-code" spellcheck="false" placeholder="// Write JavaScript here"></textarea>
            </div>
        </div>

        <div class="output-container">
            <div class="panel" id="preview-outer-container">
                <div id="macos-preview" class="macos-window">
                    <div class="macos-header">
                        <div class="macos-dots">
                            <span class="dot red"></span>
                            <span class="dot yellow"></span>
                            <span class="dot green"></span>
                        </div>
                        <div class="macos-title">localhost: preview</div>
                    </div>
                    <div class="macos-body">
                        <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
                    </div>
                </div>
            </div>

            <div class="panel console-panel">
                <div class="panel-header">Console <button id="btn-clear-console" class="btn-small">Clear</button></div>
                <div id="console-output"></div>
            </div>
        </div>
    </main>

    <div id="pdf-export-wrapper">
        <div id="pdf-content">
            <div class="pdf-text-block"><strong>Experiment: </strong><span id="pdf-render-title"></span></div>
            <div class="pdf-text-block"><strong>Objective: </strong><span id="pdf-render-obj"></span></div>
            
            <div class="pdf-label">Code:</div>
            <div class="pdf-code-container">
                <div class="pdf-mac-header">
                    <div class="macos-dots">
                        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                    </div>
                    <div class="pdf-mac-title"><i class="fa-brands fa-html5" style="color:#e34c26"></i> index.html</div>
                </div>
                <pre id="pdf-render-code"></pre>
            </div>

            <div class="pdf-label">Output:</div>
            <div class="pdf-output-container">
                <img id="pdf-render-output-img" src="" alt="Output Preview">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
